[project]
name = "bangumi-syncer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "APScheduler>=3.10.0",
    "bleach>=6.2.0",
    "cryptography>=42.0.0",
    "fastapi>=0.126.0",
    "httpx>=0.25.0",
    "ijson>=3.4.0.post0",
    "jinja2>=3.1.6",
    "markdown>=3.7",
    "pymdown-extensions>=10.14",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.0.0",
    "regex>=2024.0.0",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.38.0",
    "utls>=2026.7.8",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "ty>=0.0.9",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "responses>=0.25.0",
    "respx>=0.22.0",
    "pytest-xdist>=3.8.0",
    "pytest-playwright>=0.7.1",
]

[tool.ruff]
# 设定目标 Python 版本
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# 建议开启的初始规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (错误检测)
    "I",   # isort (自动整理 import)
    "UP",  # pyupgrade (自动升级旧语法)
    "B",   # flake8-bugbear (发现潜在设计缺陷)
]
ignore = [
    "E501",  # 行过长（由 ruff format 处理）
    "E722",  # bare except
    "B008",  # 函数调用作为默认参数
    "B904",  # raise 不带 from（简化异常处理）
]

[tool.ruff.lint.isort]
# 自动合并同类 import
combine-as-imports = true

[tool.djlint]
# 模板引擎类型
profile = "jinja"

# 缩进空格数
indent = 4

# 最大行长度
max_line_length = 120

# 子模板（HTML 片段，非完整文档）跳过 djlint 检查：
# djlint 会误判片段的闭合标签，这些片段通过主模板 {% include %} 组装
exclude = "templates/config/_.*\\.html"

[tool.pytest.ini_options]
# 基础配置
minversion = "6.0"
pythonpath = "."    # ✅ 关键修复：将根目录加入搜索路径
addopts = "-ra -q --durations=5 -m 'not e2e'"  # 默认排除 E2E（需服务器+浏览器，用 -m e2e 单独跑）
testpaths = [
]

# 匹配规则
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "Check*"]
python_functions = ["test_*", "check_*"]

# 环境变量或日志配置（可选）
log_cli = true
log_cli_level = "INFO"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # 消除新版 pytest-asyncio 的 Scope 警告

# Python 3.9 已知误报：AsyncMock + asyncio.wait_for / Task 取消时 GC 先于协程清理
filterwarnings = [
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    "ignore:coroutine 'lifespan.<locals>.delayed_scheduler_start' was never awaited:RuntimeWarning",
]

# ✅ 新增：注册自定义标记，消除 PytestUnknownMarkWarning
markers = [
    "asyncio: mark test as async",
    "performance: mark test as a performance test",
    "e2e: mark test as an end-to-end test (requires playwright + server, slow)",
]

# E2E 失败捕获参数（pytest-playwright CLI 选项）
# 本地跑 E2E：uv run pytest tests/e2e/ -m e2e --browser chromium
# 这些参数不在 ini 中配置（pytest-playwright 不识别 ini 段），由 CI workflow 显式传入：
#   --screenshot only-on-failure --video retain-on-failure --trace retain-on-failure --output test-results/e2e

# Coverage configuration
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_empty = true
