##########################bangumi设置############################

[bangumi]

# bangumi 的用户名或 UID。如果设置了用户名，只能填用户名。
# UID 就是个人资料页里 @123456 或者网址 bgm.tv/user/123456 的数字部分。例如：123456
username = 

# 令牌，注意有效期。生成网址：https://next.bgm.tv/demo/access-token
# 例如：hsdkxI4l7tUhMgo1MskxRn35qqFl5Ie5cCJ
access_token = 

# 观看记录是否仅自己可见。公开则填 False。
private = False

# 媒体服务器用户名（Plex/Emby/Jellyfin 登录名）。单用户模式下只同步这些用户产生的观看记录。
# 多个服务器或不同登录名对应同一 Bangumi 账号时，用英文逗号分隔，例如：plex_user,emby_user
media_server_username =

##########################多账号bangumi设置##########################
# 多账号模式下的配置，格式为 [bangumi-用户名]
# 当 sync.mode = multi 时，会根据媒体服务器用户名映射到对应的 bangumi 账号

# 示例配置1：
# [bangumi-user1]
# username = bangumi_user1
# access_token = token1
# private = False

# 示例配置2：
# [bangumi-user2] 
# username = bangumi_user2
# access_token = token2
# private = True

##########################bangumi-oauth设置###########################

# Bangumi 官方 OAuth 授权（替代手动填写 access_token，支持令牌自动续期）。
# 在 https://bgm.tv/dev/app 创建应用后填写下方凭证；回调地址需与 bgm.tv 应用配置一致。
# 留空 redirect_uri 时自动派生为本站点地址 + /api/bangumi/oauth/callback。
# 相关操作在「配置管理 → Bangumi OAuth 授权」卡片完成，令牌会写入对应账号段并加密存储。

# [bangumi-oauth]
# client_id = 你的应用 Client ID（留空则使用内置默认应用，开箱即用）
# client_secret = 你的应用 Client Secret（留空则使用内置默认；生产建议用环境变量 BANGUMI_OAUTH_CLIENT_SECRET 注入，勿提交明文）
# redirect_uri = http://localhost:8000/api/oauth/bangumi/callback
#
# 内置默认应用凭证由维护者在 GitHub Actions 的 Secrets（BANGUMI_OAUTH_CLIENT_ID /
# BANGUMI_OAUTH_CLIENT_SECRET）中配置，随 Docker 镜像与 Release zip 分发内置，用户无需自注册。
# 自行部署时也可用同名环境变量在运行时覆盖（优先级：本段配置 > 环境变量 > 内置占位）。

##########################bangumi-data设置###########################

[bangumi-data]

# 是否启用 bangumi-data 匹配
# 启用后会先尝试通过 bangumi-data 匹配番剧ID，匹配成功后可以减少API请求次数
enabled = True

# bangumi-data 数据源URL
# 可以修改为其他可访问的地址
data_url = https://unpkg.com/bangumi-data@0.3/dist/data.json

# 是否使用本地缓存文件，默认启用
# 启用后会将下载的数据保存到本地，之后再次启动时优先使用缓存
use_cache = True

# 本地缓存文件路径，默认在当前目录
local_cache_path = ./bangumi_data_cache.json

# 缓存有效期（天），超过此时间后会自动更新缓存
# 设置为0表示每次启动都会更新缓存
cache_ttl_days = 7

# bangumi-data 请求代理，为空则使用 script_proxy
http_proxy = 

##########################同步设置################################

[sync]

# 单用户模式还是多用户模式
# single: 单用户模式，只同步一个用户。（默认）
# multi: 多用户模式，同步多个用户。
mode = single

# 多用户模式用户映射配置
# 格式：媒体服务器用户名 = bangumi配置段名
# 例如：plex_user1 = bangumi-user1
# 这样当 plex_user1 观看完成时，会使用 [bangumi-user1] 段的配置同步到对应的 bangumi 账号

# 示例配置：
# plex_user1 = bangumi-user1
# plex_user2 = bangumi-user2
# emby_user1 = bangumi-user1

# 屏蔽关键词列表，用逗号分隔
# 当番剧标题包含这些关键词时，将跳过同步处理
# 支持中文、英文、日文等多种语言的关键词
blocked_keywords = 

# 剧场版在收到「播放开始」类 Webhook（Jellyfin/Emby/Plex）或 Tautulli mark_watching 时是否将条目标为「在看」
movie_playback_start_mark_watching = True

# 剧场版同步（media_type=movie）后是否自动将条目收藏也标为「看过」（单集格子已成功时）
# True：标为看过；False：仅更新单集进度
movie_mark_subject_completed = True

# 是否启用三次元（日剧/电影等 Bangumi type=6）支持
# False：仅匹配动画（type=2），保持原有行为（默认）
# True：在动画匹配失败时继续尝试三次元条目，覆盖日剧、真人电影等
enable_real_action = False

# 测试同步（/api/test-sync、/api/fongmi/debug/sync）时是否跳过媒体服务器用户名校验。
# 开启后测试接口不再校验 media_server_username / 用户映射，方便未配置用户名时验证匹配与标记。
# 仅对测试来源（test / test-match / fongmi 调试同步）生效，生产 webhook 路径不受影响。
test_skip_permission_check = False

# 模糊匹配置信度阈值（0~1 之间的小数，默认 0.6）
# 当 Bangumi API 模糊匹配得到的最佳候选相似度低于该阈值时，不会自动采用，
# 而是沉淀到「待审队列」，由用户在 Web 管理界面的待审页面人工确认。
# 调高该值（如 0.85）可让更多把握不大的匹配进入人工待审，避免误同步；
# 调低（如 0.4）则更激进地自动采用。自定义标题映射与 bangumi-data 本地匹配不受此阈值影响。
match_confidence_threshold = 0.6

##########################Web认证设置#############################

[auth]

# 是否启用Web管理界面认证，建议在外网环境下启用
# True: 启用认证，需要登录才能访问管理界面
# False: 禁用认证，允许无需登录直接访问（仅适用于内网环境）
