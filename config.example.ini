##########################Web / 反向代理################################

[web]

# 对外 URL 路径前缀（子路径反代时与 Nginx location 一致，例如 /Bangumi）。根路径部署留空。
# 也可用环境变量 APPLICATION_ROOT 或 BASE_PATH 覆盖。
base_path =

##########################其他设置################################

[dev]

# 脚本的 http 代理，例如 http://127.0.0.1:7890。
# 若用 OpenClash 可能慢，原因未知，可尝试 CFW 或透明代理等。
# 
# Docker环境代理配置说明：
# - bridge模式：使用 http://172.17.0.1:端口 或 http://host.docker.internal:端口
# - host模式：使用 http://127.0.0.1:端口
# - 群晖NAS：使用 http://宿主机IP:端口
script_proxy =

# Bangumi API 反向代理地址，用于替代请求 https://api.bgm.tv。留空则使用默认地址。
bgm_api_proxy = 

# Bangumi Next 反向代理地址，用于替代请求 https://next.bgm.tv。留空则使用默认地址。
bgm_next_proxy = 

# Bangumi 图片 CDN 反向代理地址，用于替代 https://lain.bgm.tv（仪表板时间线封面）。留空则使用 API 返回的原始图片地址。
bgm_image_proxy = 

# SSL证书验证，当使用代理时可能需要关闭。True为验证，False为不验证。
# 注意：关闭SSL验证会降低安全性，仅在代理环境下出现SSL错误时使用。
# 建议：如果没有使用代理或代理工作正常，请设置为 True
ssl_verify = True

# 日志路径，可填写 ./log.txt 或者 绝对路径。超过10MB时会重置。留空则禁用。
log_file = ./log.txt

# 是否开启debug模式，一般不用开。
debug = False

# sync_records 表保留天数。超过此天数的记录会在启动时自动清理。
# 0 表示永不清理（保留全部历史记录，数据库体积会持续增长）。
# 建议生产环境设置 30-90，调试环境可设置 7-14。
sync_records_retention_days = 0

# ECH（Encrypted Client Hello）加密 SNI，向 Cloudflare 隐藏 bgm.tv 请求目标。
# 取值 off（默认关闭）/ doh（自动查询）/ manual（手动提供 ech_ech_config）。
# 依赖 [dev] 代理字段同段管理；DoH 获取失败时自动降级为普通 TLS，不影响同步。
ech_mode = off

# ECH 配置来源 DoH 端点。默认阿里公共 DNS（国内直连稳定）；备选方案：
# 海外网络可改 https://dns.google/resolve（Google 公共 DNS）；也可填
# 方案 B 自部署 Total-ECH Worker 地址（需支持 dns-json 或 RFC 8484 wireformat）。
ech_doh_url = https://dns.alidns.com/resolve

# DoH 查询是否走 [dev] script_proxy。默认 False 直连（更利于隐私保护）；
# 若网络需代理才能访问 DoH（如被封锁），可设为 True。
ech_doh_use_proxy = False

# 应用 ECH 的目标域名（逗号分隔，后缀匹配：bgm.tv 同时覆盖 api.bgm.tv）。
ech_hosts = bgm.tv,chii.in,next.bgm.tv,lain.bgm.tv

# manual 模式下直接提供 base64 编码的 ECHConfigList（从
# cloudflare-ech.com 的 HTTPS RR ech= 字段提取，或 Worker 输出）。
ech_ech_config =

[trakt]
client_id = 
client_secret = 
redirect_uri = http://localhost:8000/api/trakt/auth/callback
default_sync_interval = 0 */6 * * *
default_enabled = True

[scheduler]
startup_delay = 30
max_concurrent_syncs = 3
job_timeout = 300
max_retries = 3
retry_delay = 60

