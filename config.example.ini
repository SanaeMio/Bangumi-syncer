##########################Bangumi Archive######################
# Bangumi 容灾离线查询层：把官方 Archive 项目（https://github.com/bangumi/Archive）
# 发布的全站数据快照导入本地 SQLite，读操作命中 archive 时短路 API。
#
# - 数据源：每周三 05:00 由 Bangumi 官方发布，本项目默认 08:00 自动拉取
# - 双库互备（a/b），导入期间零停服；首次启用会在启动时自动触发首次导入（约 3-8 分钟）
# - 仅影响读操作（搜索 / 查条目 / 查章节），写操作不依赖 archive
#
# 注意：archive 与 replay 已解耦，可独立启停。
# archive 仅提供「读降级」能力；如需「写降级入队 + 自动补发」请额外启用 [bangumi-replay]。
[bangumi-archive]
# archive 总开关：false 时不启动 archive 离线查询层
enabled = false

# BK-tree 模糊匹配开关：是否启用 BK-tree（编辑距离保证召回单字符 typo）
# 作为模糊匹配最后一步的候选召回算法。
# - true  ：启用 BK-tree + 短查询 JaroWinkler 打分，召回率更高。内存与构建时间随
#           标题数线性增长：56539 标题实测约 69MB/7-18s（~1.2MB/千标题），完整
#           生产库（~84 万唯一标题）外推约 1GB/分钟级，请先实测再开启
# - false （默认）：回退 trigram OR + 覆盖度预筛兜底，零额外内存，适合内存敏感的小项目
use_bktree = false

# === Archive 数据相关 ===
# 数据目录（双库 + meta + active 指针 + 索引缓存）
# 默认放到 ./data/archive 子目录，与 sync_records.db 等其他数据文件隔离
data_dir = ./data/archive
# HTTP 代理（留空则继承 [dev] script_proxy）
http_proxy =
# SSL 校验
ssl_verify = true
# 定时更新 cron（默认每周三 08:00，晚于官方 05:00 发布）
update_cron = 0 8 * * 3
# 磁盘空间阈值（MB），低于此值跳过导入
# 下载/上传/解压/导入均在 data_dir/.tmp/ 完成；解压后立即删 zip，导入峰值 = active 库 ~0.8GB + 解压 ~1GB + 新库 ~0.8GB + WAL 余量 ≈ 2.6GB，阈值设为 3000MB
min_disk_space_mb = 3000
# 导入失败重试间隔（秒）
retry_interval = 3600

# Replay 待同步队列相关配置已迁移到独立的 [bangumi-replay] 段
# （archive 与 replay 已解耦，replay 可独立启用，详见 [bangumi-replay] 段说明）

##########################Bangumi Replay######################
# Bangumi 待同步队列补发：当 Bangumi API 不可达（5xx/连接错误/超时/429）时，
# 把已匹配 subject_id+episode_id 的同步任务持久化到 pending_sync_queue 表，
# API 恢复后由补发调度器自动重放，避免 API 抖动期间同步丢失。
#
# - 仅对写操作（mark_episode_watched / ensure_subject_watching）生效
# - 与 archive 完全解耦：archive 关闭时 replay 仍可独立工作
# - 但**完全实现无网缓存请求需要 archive 配合**：
#     * 不开 archive 时，读操作（搜索/查条目）会直接请求 API，API 不可达期间无法匹配新条目
#     * 仅当 archive 启用时，读操作可命中本地数据集，实现「API 完全不可达时仍能匹配并入队」
#     * 因此「无网环境下匹配新条目并缓存待补发」这一完整流程依赖 archive 启用
# - 如仅需要「API 已匹配好但写失败时补发」（例如外部已确认 subject_id），可不开 archive
[bangumi-replay]
# replay 总开关：false 时关闭写降级入队与定时补发（与 archive 解耦，可独立启停）
enabled = true

# API 不可达 TTL（秒）：标记后此期间内所有写操作直接入队，不发请求
# 默认 300 秒（5 分钟），到期后下一次请求恢复探测
api_probe_interval = 300

# 补发调度 cron（五段式，默认每 10 分钟扫描一次 pending_sync_queue）
replay_cron = */10 * * * *

# 每轮补发批量大小（默认 20）
replay_batch_size = 20

# 单条任务最大重试次数（超过则标记为 abandoned）
max_attempts = 50