<div class="card airing-calendar-card flex-fill" id="airing-calendar-row">
    <div class="card-header py-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center">
                <i class="bi bi-calendar-week me-2 card-header-icon"></i>
                <h6 class="m-0 fw-semibold card-header-title">我在追的放送</h6>
                <span id="airing-calendar-summary"
                      class="badge rounded-pill bg-secondary ms-2 small fw-normal d-none"></span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="btn-group btn-group-sm app-action-capsule" role="group">
                    <button type="button"
                            class="btn btn-outline-secondary airing-type-btn active"
                            data-type="0">全部</button>
                    <button type="button"
                            class="btn btn-outline-secondary airing-type-btn"
                            data-type="2">动画</button>
                    <button type="button"
                            class="btn btn-outline-secondary airing-type-btn"
                            data-type="6">三次元</button>
                    <button type="button"
                            class="btn btn-outline-secondary"
                            id="airing-refresh"
                            title="刷新在看列表缓存">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div class="dropdown d-none" id="airing-account-dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            title="切换 Bangumi 账号">
                        <i class="bi bi-person-circle me-1"></i><span id="airing-account-label">账号</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" id="airing-account-menu">
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body px-3 pt-2 pb-3">
        <div id="airing-calendar-container">
            <div class="text-center py-3 app-text-muted-block">
                <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
        </div>
    </div>
</div>
