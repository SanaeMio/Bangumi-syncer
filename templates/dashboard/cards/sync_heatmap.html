<div class="card heatmap-card">
    <div class="card-header py-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <i class="bi bi-grid-3x3-gap me-2 card-header-icon"></i>
                <h6 class="m-0 fw-semibold card-header-title">同步热力图</h6>
            </div>
            <div class="heatmap-legend">
                <span>少</span>
                <div class="heatmap-legend__cell heatmap-legend__cell--l0"></div>
                <div class="heatmap-legend__cell heatmap-legend__cell--l1"></div>
                <div class="heatmap-legend__cell heatmap-legend__cell--l2"></div>
                <div class="heatmap-legend__cell heatmap-legend__cell--l3"></div>
                <div class="heatmap-legend__cell heatmap-legend__cell--l4"></div>
                <span>多</span>
            </div>
        </div>
    </div>
    <div class="card-body px-3 pt-2 pb-2">
        <div class="heatmap-container" id="heatmap-container">
            <div class="text-center py-3 app-text-muted-block">
                <div class="spinner-border spinner-border-sm" role="status"></div>
            </div>
        </div>
    </div>
</div>
