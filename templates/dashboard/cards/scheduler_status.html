<div class="card flex-fill">
    <div class="card-header py-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <i class="bi bi-clock-history me-2 card-header-icon"></i>
                <h6 class="m-0 fw-semibold card-header-title">调度器状态</h6>
                <span id="scheduler-status-summary"
                      class="badge rounded-pill bg-secondary ms-2 d-none small fw-normal"></span>
            </div>
            <button type="button"
                    class="btn btn-sm btn-outline-secondary py-0 px-1"
                    id="scheduler-status-refresh"
                    title="刷新状态">
                <i class="bi bi-arrow-clockwise small"></i>
            </button>
        </div>
    </div>
    <div id="scheduler-status-body" class="card-body p-3">
        <div class="sync-timeline" id="scheduler-timeline">
            <div class="text-center py-4 app-text-muted-block">
                <div class="spinner-border spinner-border-sm" role="status"></div>
                <div class="mt-2 small">加载中...</div>
            </div>
        </div>
    </div>
</div>
