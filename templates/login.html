<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <script>window.__APP_BASE_PATH__ = {{ public_base_path_json() }};</script>
        <script>
        (function(){
            var t=localStorage.getItem('app-theme');
            if(!t) t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
            var c=localStorage.getItem('app-color')||'sakura';
            if(c==='eggyolk'||c==='sapphire')c='sakura';
            document.documentElement.setAttribute('data-theme',t);
            document.documentElement.setAttribute('data-color',c);
            document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
        })();
        </script>
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>登录 - Bangumi-Syncer</title>
        <link href="{{ '/static/favicon.ico' | static_v }}" rel="icon" sizes="any">
        <link href="{{ '/static/apple-touch-icon.png' | static_v }}"
              rel="apple-touch-icon"
              sizes="180x180">
        <link href="{{ '/static/css/bootstrap.min.css' | static_v }}"
              rel="stylesheet">
        <link href="{{ '/static/css/bootstrap-icons.css' | static_v }}"
              rel="stylesheet">
        <link href="{{ '/static/css/theme-base.css' | static_v }}" rel="stylesheet">
        <link href="{{ '/static/css/records-detail.css' | static_v }}"
              rel="stylesheet">
        <link href="{{ '/static/css/components.css' | static_v }}" rel="stylesheet">
        <link href="{{ '/static/css/pages.css' | static_v }}" rel="stylesheet">
        <link href="{{ '/static/css/dashboard.css' | static_v }}" rel="stylesheet">
        <link href="{{ '/static/css/effects.css' | static_v }}" rel="stylesheet">
    </head>
    <body class="app-body login-body">
        <div class="login-page">
            <div class="login-page__glow" aria-hidden="true"></div>
            <main class="login-page__inner">
                <div class="card login-card" aria-labelledby="loginTitle">
                    <div class="card-body login-card__body">
                        <div class="login-head">
                            <div class="login-brand">
                                <img src="{{ '/static/apple-touch-icon.png' | static_v }}"
                                     alt=""
                                     class="login-brand__mark">
                                <img src="{{ '/static/logo-wordmark.png' | static_v }}"
                                     alt="Bangumi-Syncer"
                                     class="login-brand__wordmark">
                            </div>
                            <h1 class="login-title" id="loginTitle">欢迎回来</h1>
                        </div>
                        <div id="alert-container" class="login-alert-slot"></div>
                        <form id="loginForm" class="login-form" novalidate>
                            <div class="login-field">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person" aria-hidden="true"></i>用户名
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="输入用户名"
                                       autocomplete="username"
                                       aria-describedby="username-feedback"
                                       required>
                                <div class="invalid-feedback" id="username-feedback">请输入用户名</div>
                            </div>
                            <div class="login-field">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock" aria-hidden="true"></i>密码
                                </label>
                                <div class="login-input-wrap">
                                    <input type="password"
                                           class="form-control pe-5"
                                           id="password"
                                           name="password"
                                           placeholder="输入密码"
                                           autocomplete="current-password"
                                           aria-describedby="password-feedback"
                                           required>
                                    <button type="button"
                                            class="login-password-toggle"
                                            id="togglePasswordVisibility"
                                            aria-label="显示密码"
                                            aria-pressed="false">
                                        <i class="bi bi-eye login-password-toggle__icon login-password-toggle__icon--show"
                                           aria-hidden="true"></i>
                                        <i class="bi bi-eye-slash login-password-toggle__icon login-password-toggle__icon--hide"
                                           aria-hidden="true"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback" id="password-feedback">请输入密码</div>
                                <p class="login-caps-hint" id="capsLockHint" hidden>
                                    <i class="bi bi-capslock" aria-hidden="true"></i>Caps Lock 已开启
                                </p>
                            </div>
                            <button type="submit"
                                    class="btn btn-primary login-submit"
                                    id="loginBtn"
                                    data-state="idle">
                                <span class="login-submit__layer login-text">
                                    <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>登录
                                </span>
                                <span class="login-submit__layer login-submit__status">
                                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                                    登录中...
                                </span>
                                <span class="login-submit__layer login-submit__success">
                                    <i class="bi bi-check2-circle me-2" aria-hidden="true"></i>登录成功
                                </span>
                            </button>
                            <p class="visually-hidden"
                               id="loginStatus"
                               role="status"
                               aria-live="polite"></p>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <script defer src="{{ '/static/js/bootstrap.bundle.min.js' | static_v }}"></script>
        <script defer src="{{ '/static/js/api-utils.js' | static_v }}"></script>
        <script defer src="{{ '/static/js/toast-ui.js' | static_v }}"></script>
        <script defer src="{{ '/static/js/ui-utils.js' | static_v }}"></script>
        <script defer src="{{ '/static/js/auth.js' | static_v }}"></script>
        <script defer src="{{ '/static/js/theme.js' | static_v }}"></script>
    </body>
</html>
