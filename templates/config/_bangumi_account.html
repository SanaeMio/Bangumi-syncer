        <div class="row">
            <div class="col-12">
                <div id="config-section-bgm" class="card mb-4 config-card">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-person-circle me-2 card-header-icon"></i>
                            <h6 class="m-0 fw-semibold card-header-title">Bangumi 账号配置</h6>
                        </div>
