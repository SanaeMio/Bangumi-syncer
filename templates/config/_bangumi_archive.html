                <div id="config-section-bangumi-archive" class="card mb-4 config-card">
                    <div class="card-header py-3">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-database-fill me-2 card-header-icon"></i>
                            <h6 class="m-0 fw-semibold card-header-title">Bangumi Archive 离线查询层</h6>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-toggle-on me-1 text-primary"></i>启用 Archive
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="默认关闭。开启后每周三自动下载 Bangumi 全站数据快照到本地 SQLite。"></i>
                                </label>
                                <div class="form-check form-switch d-flex align-items-center mb-0">
                                    <input class="form-check-input me-2"
                                           type="checkbox"
                                           id="bangumi-archive-enabled"
                                           name="bangumi_archive.enabled">
                                    <label class="form-check-label" for="bangumi-archive-enabled">启用</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="bangumi-archive-update-cron" class="form-label fw-semibold">
                                    <i class="bi bi-clock me-1 text-info"></i>定时更新 Cron
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="五段式 Cron，默认每周三 08:00 执行（晚于官方 05:00 发布）。"></i>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="bangumi-archive-update-cron"
                                       name="bangumi_archive.update_cron"
                                       placeholder="0 8 * * 3"
                                       value="0 8 * * 3"
                                       data-cron-preview>
                            </div>
                            <div class="col-md-12">
                                <label for="bangumi-archive-data-dir" class="form-label fw-semibold">
                                    <i class="bi bi-folder me-1 text-warning"></i>数据目录
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="存放双库（a/b）、meta、active 指针与索引缓存的目录。默认 ./data/archive，Docker 建议挂载到 /app/data。"></i>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="bangumi-archive-data-dir"
                                       name="bangumi_archive.data_dir"
                                       placeholder="./data/archive">
                            </div>
                            <div class="col-md-6">
                                <label for="bangumi-archive-http-proxy" class="form-label fw-semibold">
                                    <i class="bi bi-globe me-1 text-secondary"></i>HTTP 代理
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="下载 dump zip 时使用的代理，留空则继承 [dev] script_proxy。镜像源 fallback 链会自动尝试。"></i>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="bangumi-archive-http-proxy"
                                       name="bangumi_archive.http_proxy"
                                       placeholder="留空继承 script_proxy">
                            </div>
                            <div class="col-md-3">
                                <label for="bangumi-archive-min-disk-space" class="form-label fw-semibold">
                                    <i class="bi bi-hdd me-1 text-success"></i>磁盘阈值 (MB)
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="低于此可用空间时跳过导入，避免磁盘写满。默认 2000MB（双库 ~2.8GB + 索引 ~1GB + zip ~0.4GB）。"></i>
                                </label>
                                <input type="number"
                                       class="form-control"
                                       id="bangumi-archive-min-disk-space"
                                       name="bangumi_archive.min_disk_space_mb"
                                       min="100"
                                       value="2000">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">
                                    <i class="bi bi-shield-check me-1 text-info"></i>SSL 校验
                                    <i class="bi bi-question-circle ms-1 text-muted"
                                       data-bs-toggle="tooltip"
                                       title="下载时是否校验 SSL 证书，自签名环境可关闭。"></i>
                                </label>
                                <div class="form-check form-switch d-flex align-items-center mb-0">
                                    <input class="form-check-input me-2"
                                           type="checkbox"
                                           id="bangumi-archive-ssl-verify"
                                           name="bangumi_archive.ssl_verify"
                                           checked>
                                    <label class="form-check-label" for="bangumi-archive-ssl-verify">校验</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="alert alert-warning mt-3">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    <strong>警告：</strong>此功能占用的磁盘较大，约需要占用1.5GB大小，请确认是否启用。
                                </div>
                                <div class="alert alert-info mb-0 d-flex align-items-center">
                                    <i class="bi bi-info-circle me-2"></i>
                                    <strong>说明：</strong>本功能可以大幅减少对bangumi的api请求，提升对条目的匹配准确性。启用后首次需手动触发导入（约 3-8 分钟，下载 ~400MB 全量数据）。
                                    数据每周三 05:00 由 Bangumi 官方发布，本项目 08:00 开始自动拉取。
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% include "config/_bangumi_replay.html" %}
