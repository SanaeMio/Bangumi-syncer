        <div class="row">
            <div class="col-12">
                <div id="config-section-notify" class="card shadow-sm config-card mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-bell me-2 card-header-icon"></i>
                            <h6 class="m-0 fw-semibold card-header-title">通知配置</h6>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary"
                                    onclick="showChannelConfigModal()">
                                <i class="bi bi-sliders me-1"></i>渠道配置

                            <button type="button"
                                    class="btn btn-sm btn-primary"
                                    onclick="showNotificationRuleModal()">

                    </div>
                </div>
