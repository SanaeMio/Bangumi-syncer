<!-- 今日放送提醒（依赖 Bangumi Archive 的 episode.airdate 数据） -->
<div class="row">
    <div class="col-12">
        <div id="config-section-notify-airing-today" class="card mb-4 config-card">
            <div class="card-header py-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-bell me-2 card-header-icon"></i>
                    <h6 class="m-0 fw-semibold card-header-title">今日放送提醒</h6>
                </div>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <div class="alert alert-info mb-3 d-flex align-items-center">
                            <i class="bi bi-info-circle me-2"></i>
                            <span><strong>说明：</strong>依赖 Bangumi Archive 的 <code>episode.airdate</code> 数据，仅在 Archive 启用且已导入数据时才会真正执行。对应通知类型 <code>airing_today</code>（归入「调度任务」分类），需在「通知配置」中订阅该事件才会推送。</span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-toggle-on me-1 text-primary"></i>启用
                            <i class="bi bi-question-circle ms-1 text-muted"
                               data-bs-toggle="tooltip"
                               title="总开关，默认开启。但仍需 Archive 启用才会真正执行；关闭后定时任务不再触发。"></i>
                        </label>
                        <div class="form-check form-switch d-flex align-items-center mb-0">
                            <input class="form-check-input me-2"
                                   type="checkbox"
                                   id="notify-airing-today-enabled"
                                   name="notify_airing_today.enabled"
                                   checked>
                            <label class="form-check-label" for="notify-airing-today-enabled">启用</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="notify-airing-today-cron" class="form-label fw-semibold">
                            <i class="bi bi-clock me-1 text-info"></i>定时 Cron
                            <i class="bi bi-question-circle ms-1 text-muted"
                               data-bs-toggle="tooltip"
                               title="五段式 Cron，默认每日 09:00 执行。保存配置后定时任务会热更新，无需重启。"></i>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="notify-airing-today-cron"
                               name="notify_airing_today.cron"
                               placeholder="0 9 * * *"
                               value="0 9 * * *"
                               data-cron-preview>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-eye me-1 text-success"></i>仅我在追
                            <i class="bi bi-question-circle ms-1 text-muted"
                               data-bs-toggle="tooltip"
                               title="开启后只统计你在 Bangumi 上「在看」的番剧（动画 + 三次元），需配置 Bangumi 账号；获取失败时自动降级为全部放送。"></i>
                        </label>
                        <div class="form-check form-switch d-flex align-items-center mb-0">
                            <input class="form-check-input me-2"
                                   type="checkbox"
                                   id="notify-airing-today-only-watching"
                                   name="notify_airing_today.only_watching"
                                   checked>
                            <label class="form-check-label" for="notify-airing-today-only-watching">启用</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
