        <!-- 屏蔽关键词配置卡片 -->
        <div class="row">
            <div class="col-12">
                <div id="config-section-blocked-keywords"
                     class="card mb-4 config-card">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-shield-x me-2 card-header-icon text-danger"></i>
                            <h6 class="m-0 fw-semibold card-header-title">屏蔽关键词</h6>
                        </div>
                        <button type="button"
                                class="btn btn-sm btn-primary"
                                id="blocked-keywords-add-btn"
                                onclick="BlockedKeywords.showAddInput()">
                            <i class="bi bi-plus-circle me-1"></i>添加关键词
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info mb-3">
                            <i class="bi bi-info-circle me-2"></i>
                            标题包含以下关键词的番剧将跳过同步（不区分大小写）。点击关键词右侧删除按钮可移除。
                        </div>
                        <!-- 隐藏 input 保留以兼容 ConfigForm.serialize（name="sync.blocked_keywords"） -->
                        <input type="hidden"
                               class="form-control"
                               id="blocked-keywords"
                               name="sync.blocked_keywords">
                        <!-- 关键词列表 -->
                        <div id="blocked-keywords-chips" class="blocked-keywords-list"></div>
                        <!-- 添加输入区（默认隐藏，点击右上角按钮显示） -->
                        <div id="blocked-keywords-input-area"
                             class="input-group mt-3"
                             style="display: none;">
                            <input type="text"
                                   class="form-control"
                                   id="blocked-keywords-input"
                                   placeholder="输入关键词后回车或点击添加按钮">
                            <button class="btn btn-primary"
                                    type="button"
                                    onclick="BlockedKeywords.confirmAdd()">
                                <i class="bi bi-check-lg me-1"></i>添加
                            </button>
                            <button class="btn btn-outline-secondary"
                                    type="button"
                                    onclick="BlockedKeywords.cancelAdd()">取消</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
